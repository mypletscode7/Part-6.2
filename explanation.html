<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explanation | MYP Haven</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        /* =========================================================
           GLOBAL
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: #FAFAF8;
            color: #202333;
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
        }

        button {
            font-family: inherit;
        }

        /* =========================================================
           PAGE
        ========================================================= */

        .page {
            width: min(1150px, calc(100% - 40px));
            margin: 0 auto;
            padding: 35px 0 70px;
        }

        /* =========================================================
           TOP NAVIGATION
        ========================================================= */

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo-button {
            border: none;
            background: transparent;
            cursor: pointer;

            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 23px;
            font-weight: 800;

            color: #202333;

            transition: transform 0.2s ease;
        }

        .logo-button:hover {
            transform: translateY(-2px);
        }

        .dashboard-button {
            border: none;
            background: #202333;
            color: white;

            padding: 13px 20px;
            border-radius: 999px;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .dashboard-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(32, 35, 51, 0.16);
        }

        /* =========================================================
           MAIN HEADING
        ========================================================= */

        .hero {
            margin-top: 75px;
            margin-bottom: 48px;
        }

        .hero h1 {
            font-family: "Bricolage Grotesque", sans-serif;

            font-size: clamp(50px, 7vw, 82px);
            line-height: 0.95;
            letter-spacing: -3px;

            font-weight: 800;

            margin-bottom: 17px;
        }

        .hero p {
            font-size: 18px;
            line-height: 1.6;
            font-weight: 600;

            color: #73798A;
        }

        /* =========================================================
           TOPIC BUTTONS
        ========================================================= */

        .topic-list {
            display: flex;
            flex-direction: column;
            gap: 17px;
        }

        .topic-button {
            width: 100%;

            border: none;
            border-radius: 25px;

            padding: 27px 31px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            text-align: left;

            cursor: pointer;

            color: #202333;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                filter 0.25s ease;
        }

        .topic-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 17px 35px rgba(32, 35, 51, 0.10);
            filter: brightness(1.015);
        }

        .topic-button:active {
            transform: translateY(-1px);
        }

        .topic-content {
            display: flex;
            flex-direction: column;
            gap: 7px;

            padding-right: 25px;
        }

        .topic-title {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 26px;
            line-height: 1.15;
            font-weight: 800;
        }

        .topic-description {
            font-family: "DM Sans", sans-serif;
            font-size: 14px;
            line-height: 1.5;
            font-weight: 600;

            color: rgba(32, 35, 51, 0.68);
        }

        .topic-arrow {
            flex-shrink: 0;

            width: 43px;
            height: 43px;

            border-radius: 50%;

            display: grid;
            place-items: center;

            background: rgba(255, 255, 255, 0.5);

            font-size: 21px;
            font-weight: 800;

            transition: transform 0.25s ease;
        }

        .topic-button:hover .topic-arrow {
            transform: translateX(5px);
        }

        /* =========================================================
           RESOURCE VIEW
        ========================================================= */

        .resource-view {
            display: none;
            animation: resourceIn 0.45s ease both;
        }

        .resource-view.active {
            display: block;
        }

        @keyframes resourceIn {

            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        .resource-header {
            margin-bottom: 40px;
        }

        .resource-header h1 {
            font-family: "Bricolage Grotesque", sans-serif;

            font-size: clamp(40px, 6vw, 65px);
            line-height: 1;

            letter-spacing: -2px;

            font-weight: 800;

            margin-bottom: 15px;
        }

        .resource-header .accent-line {
            width: 65px;
            height: 6px;

            border-radius: 999px;

            margin-top: 20px;
        }

        .resource-content {
            font-family: "DM Sans", sans-serif;

            font-size: 17px;
            line-height: 1.75;

            font-weight: 600;
        }

        .resource-content p {
            margin-bottom: 25px;
        }

        .resource-content strong {
            font-weight: 800;
        }

        .resource-content h2 {
            font-family: "Bricolage Grotesque", sans-serif;

            font-size: 32px;
            line-height: 1.1;

            margin: 45px 0 20px;
        }

        .resource-content h3 {
            font-family: "Bricolage Grotesque", sans-serif;

            font-size: 23px;

            margin-bottom: 10px;
        }

        .resource-content ul {
            padding-left: 25px;
            margin-bottom: 25px;
        }

        .resource-content li {
            margin-bottom: 10px;
        }

        /* =========================================================
           YEAR CARDS
        ========================================================= */

        .year-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 17px;

            margin: 30px 0 45px;
        }

        .year-card {
            padding: 27px;

            border-radius: 23px;

            background: white;

            box-shadow: 0 8px 25px rgba(32, 35, 51, 0.06);
        }

        .year-card h3 {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 24px;

            margin-bottom: 8px;
        }

        .year-card h4 {
            font-size: 15px;
            margin-bottom: 11px;
        }

        .year-card p {
            margin: 0;
            font-size: 15px;
            line-height: 1.6;
        }

        /* =========================================================
           SUBJECT CARDS
        ========================================================= */

        .subject-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;

            margin: 25px 0 35px;
        }

        .subject-card {
            padding: 21px 23px;

            border-radius: 19px;

            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 19px;
            font-weight: 800;

            text-align: center;
        }

        /* =========================================================
           FLOW
        ========================================================= */

        .assessment-flow {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 13px;

            margin: 30px 0;
        }

        .flow-card {
            width: min(100%, 760px);

            background: white;

            padding: 25px 28px;

            border-radius: 22px;

            box-shadow: 0 8px 25px rgba(32, 35, 51, 0.06);

            text-align: center;
        }

        .flow-arrow {
            font-size: 32px;
            font-weight: 800;
        }

        /* =========================================================
           TABLES
        ========================================================= */

        .table-wrapper {
            overflow-x: auto;
            margin: 25px 0 35px;
        }

        table {
            width: 100%;

            border-collapse: separate;
            border-spacing: 0;

            background: white;

            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 8px 25px rgba(32, 35, 51, 0.05);
        }

        th,
        td {
            padding: 16px 17px;

            text-align: left;

            border-bottom: 1px solid #ECECF0;

            font-size: 14px;
            line-height: 1.5;
        }

        th {
            font-family: "Bricolage Grotesque", sans-serif;
            font-size: 15px;

            background: #F5F3F0;
        }

        tr:last-child td {
            border-bottom: none;
        }

        /* =========================================================
           EXAMPLE BOX
        ========================================================= */

        .example-box {
            padding: 27px;

            border-radius: 24px;

            background: white;

            box-shadow: 0 8px 25px rgba(32, 35, 51, 0.06);

            margin: 30px 0;
        }

        .example-box p {
            margin-bottom: 8px;
        }

        .example-box p:last-child {
            margin-bottom: 0;
        }

        /* =========================================================
           BACK BUTTON
        ========================================================= */

        .back-area {
            margin-top: 50px;

            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .back-button {
            border: none;

            background: #202333;
            color: white;

            padding: 14px 23px;

            border-radius: 999px;

            cursor: pointer;

            font-size: 14px;
            font-weight: 700;

            transition: 0.25s ease;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(32, 35, 51, 0.15);
        }

        /* =========================================================
           RESPONSIVE
        ========================================================= */

        @media (max-width: 700px) {

            .page {
                width: calc(100% - 28px);
                padding-top: 25px;
            }

            .hero {
                margin-top: 55px;
            }

            .hero h1 {
                letter-spacing: -2px;
            }

            .topic-button {
                padding: 23px;
                border-radius: 21px;
            }

            .topic-title {
                font-size: 22px;
            }

            .topic-description {
                font-size: 13px;
            }

            .year-grid,
            .subject-grid {
                grid-template-columns: 1fr;
            }

            .resource-content {
                font-size: 16px;
            }

            .resource-content h2 {
                font-size: 28px;
            }

            th,
            td {
                min-width: 180px;
            }

        }

    </style>
</head>

<body>

<div class="page">

    <!-- =========================================================
         TOP BAR
    ========================================================== -->

    <header class="topbar">

    <!-- =========================================================

    ========================================================== -->

    <section id="libraryView">

        <div class="hero">

        <div class="topic-list">

            <!-- 1 -->

            <button

            <button

                    <span class="topic-title">

                    </span>

            <!-- 6 -->

            <button

                    <span class="topic-title">

            <button

    </section>


    <!-- =========================================================
         RESOURCE VIEW
    ========================================================== -->

    <section
        id="resourceView"
        class="resource-view"

        <div class="resource-header">

            <h1 id="resourceTitle"></h1>

            <div
                id="resourceAccent"

        </div>


        <div
            id="resourceContent"

        ></div>


        <div class="back-area">

</div>


<script>

    /* =========================================================
       DASHBOARD
    ========================================================== */

    function goDashboard() {

        window.location.href = "./dashboard.html";

    }


    /* =========================================================
       RESOURCE DATA
    ========================================================== */

    const resources = {

        "what-myp": {

            title: "What is the MYP?",

            color: "#F4B6A6",

            content: `

                <p>
                    The MYP stands for the
                    <strong style="color:#F4B6A6;">
                        Middle Years Programme
                    </strong>,
                    an
                    <strong style="color:#F4B6A6;">
                        educational framework
                    </strong>
                    created by the
                    <strong style="color:#F4B6A6;">
                        International Baccalaureate (IB)
                    </strong>
                    for students aged
                    <strong style="color:#F4B6A6;">
                        11 to 16
                    </strong>.
                </p>

                <p>
                    The MYP is designed as a
                    <strong style="color:#F4B6A6;">
                        five-year programme
                    </strong>,
                    known as
                    <strong style="color:#F4B6A6;">
                        MYP years 1 to 5
                    </strong>.
                    Some schools offer only part of it.
                </p>

                <p>
                    The MYP is a
                    <strong style="color:#F4B6A6;">
                        school programme
                    </strong>,
                    rather than one
                    <strong style="color:#F4B6A6;">
                        universal syllabus
                    </strong>.
                    It's a framework meant to support a curriculum.
                </p>

                <p>
                    The
                    <strong style="color:#F4B6A6;">
                        MYP meaning
                    </strong>
                    is straightforward:
                    <strong style="color:#F4B6A6;">
                        MYP
                    </strong>
                    stands for Middle Years Programme, the
                    <strong style="color:#F4B6A6;">
                        IB framework
                    </strong>
                    for students aged
                    <strong style="color:#F4B6A6;">
                        11 to 16
                    </strong>.
                </p>

            `

        },


        /* =====================================================
           YEARS & PHASES
        ===================================================== */

        "years-phases": {

            title: "MYP Years & Phases",

            color: "#C9E3B4",

            content: `

                <h2>The Five MYP Years</h2>

                <p>
                    The full MYP is designed as a
                    <strong>five-year programme</strong>,
                    known as
                    <strong>MYP Years 1 to 5</strong>.
                    Some schools offer only part of the programme.
                </p>


                <div class="year-grid">

                    <div class="year-card" style="background:#CDE8BF;">

                        <h3>MYP 1 · Grade 6</h3>

                        <h4>First Year</h4>

                        <p>
                            The beginning of your MYP journey.
                        </p>

                    </div>


                    <div class="year-card" style="background:#F6E79A;">

                        <h3>MYP 2 · Grade 7</h3>

                        <h4>Second Year</h4>

                        <p>
                            Building confidence and developing new skills.
                        </p>

                    </div>


                    <div class="year-card" style="background:#DDD2F4;">

                        <h3>MYP 3 · Grade 8</h3>

                        <h4>Third Year</h4>

                        <p>
                            Growing your knowledge and independence.
                        </p>

                    </div>


                    <div class="year-card" style="background:#BFDFF0;">

                        <h3>MYP 4 · Grade 9</h3>

                        <h4>Fourth Year</h4>

                        <p>
                            Taking on greater challenges and responsibility.
                        </p>

                    </div>


                    <div class="year-card" style="background:#F6C9A8;">

                        <h3>MYP 5 · Grade 10</h3>

                        <h4>Fifth Year: The Final Stretch</h4>

                        <p>
                            Applying everything you have learnt to complete the programme.
                        </p>

                    </div>

                </div>


                <h2>What Are Phases?</h2>

                <p>
                    <strong>Phases are mainly applied to Language Acquisition.</strong>
                    Whether you are taking German, Chinese, Spanish, or another MYP Language Acquisition subject, your learning is organized into phases.
                    In Language Acquisition, there are three levels:
                    <strong>Emergent, Capable, and Proficient.</strong>
                    Your given phase is your current abilities in that language.
                </p>

                <p>
                    <strong>Emergent = Phases 1–2</strong>
                </p>

                <p>
                    <strong>Capable = Phases 3–4</strong>
                </p>

                <p>
                    <strong>Proficient = Phases 5–6</strong>
                </p>

                <p>
                    Your phase is not a grade or a mark. It is where you are in your language that matches your abilities.
                </p>

                <p>
                    The important thing is that Phase 1 does not mean Grade 6, Phase 2 does not mean Grade 7, and so on.
                    A student's phase is based on their language ability and development, not simply their school year.
                    For example, two students in MYP5 could be in completely different phases of German.
                    One might be in Phase 2, while another could be in Phase 5.
                </p>

            `

        },


        /* =====================================================
           SUBJECTS
        ===================================================== */

        "subjects": {

            title: "What are all the MYP Subjects?",

            color: "#B7DCE8",

            content: `

                <p>
                    The MYP includes a range of subject groups designed to develop different areas of knowledge and skills.
                </p>

                <div class="subject-grid">

                    <div class="subject-card" style="background:#F7B2C4;">
                        Language and Literature
                    </div>

                    <div class="subject-card" style="background:#C6E6A8;">
                        Language Acquisition
                    </div>

                    <div class="subject-card" style="background:#C6E6A8;">
                        Language Acquisition
                    </div>

                    <div class="subject-card" style="background:#D8C4F1;">
                        Individuals and Societies
                    </div>

                    <div class="subject-card" style="background:#A9DDE5;">
                        Sciences
                    </div>

                    <div class="subject-card" style="background:#F5DFA7;">
                        Mathematics
                    </div>

                    <div class="subject-card" style="background:#E8B4C8;">
                        Arts
                    </div>

                    <div class="subject-card" style="background:#F3C6A5;">
                        Design
                    </div>

                    <div class="subject-card" style="background:#B6D7C5;">
                        Physical and Health Education
                    </div>

                </div>

            `

        },


        /* =====================================================
           ASSESSMENT
        ===================================================== */

        "assessment": {

            title: "How MYP Assessment Works",

            color: "#A8DDE0",

            content: `

                <div class="assessment-flow">

                    <div class="flow-card">
                        Your teacher gives you a summative assignment. It might be one or more criteria.
                    </div>

                    <div class="flow-arrow">↓</div>

                    <div class="flow-card">
                        Your work is marked using one the MYP criteria for that subject.
                    </div>

                    <div class="flow-arrow">↓</div>

                    <div class="flow-card">
                        Your teacher uses the criterion descriptors to decide which achievement level from 0 to 8 best matches your work.
                    </div>

                    <div class="flow-arrow">↓</div>

                    <div class="flow-card">
                        Your achievement levels across the four criteria are added together to create a total out of 32.
                        Your total mark will be matched to a grade level from 1–7.
                    </div>

                </div>


                <h2>Example</h2>

                <div class="example-box">

                    <p>Criterion A: <strong>7</strong></p>

                    <p>Criterion B: <strong>6</strong></p>

                    <p>Criterion C: <strong>7</strong></p>

                    <p>Criterion D: <strong>6</strong></p>

                    <p><strong>Total = 26/32</strong></p>

                    <p><strong>Final Mark : 6/7 (no pun intended)</strong></p>

                </div>


                <p>
                    That total is then converted into your final 1–7 subject grade.
                    The 6/7 was determined using this system:
                </p>


                <div class="table-wrapper">

                    <table>

                        <thead>
                            <tr>
                                <th>Grade</th>
                                <th>Total Criterion Points</th>
                                <th>Performance Level</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr>
                                <td>1</td>
                                <td>0–5</td>
                                <td>Excellent</td>
                            </tr>

                            <tr>
                                <td>2</td>
                                <td>6–9</td>
                                <td>Basic Awareness</td>
                            </tr>

                            <tr>
                                <td>3</td>
                                <td>10–14</td>
                                <td>Developing</td>
                            </tr>

                            <tr>
                                <td>4</td>
                                <td>15–18</td>
                                <td>Satisfactory</td>
                            </tr>

                            <tr>
                                <td>5</td>

    /* =========================================================
       OPEN RESOURCE
    ========================================================== */

    function openResource(resourceID) {

        const resource = resources[resourceID];

        if (!resource) {
            return;
        }

        document.getElementById("libraryView").style.display = "none";

        const resourceView = document.getElementById("resourceView");

        resourceView.classList.remove("active");

        void resourceView.offsetWidth;

        document.getElementById("resourceTitle").textContent =
            resource.title;

        document.getElementById("resourceAccent").style.background =
            resource.color;

        document.getElementById("resourceContent").innerHTML =
            resource.content;

        resourceView.classList.add("active");

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    /* =========================================================
       BACK TO TOPIC BUTTONS
    ========================================================== */

    function backToBooks() {

        document.getElementById("resourceView").classList.remove("active");

        document.getElementById("libraryView").style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

</script>
